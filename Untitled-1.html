<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>

    <h1>Formulario de Registro de Usuario</h1>

    <form id="formRegistro">

        <!-- Nombre completo -->
        <div>
            <label for="nombre">Nombre completo:</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
        </div>
        <br>

        <!-- Correo electrónico -->
        <div>
            <label for="correo">Correo electrónico:</label><br>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
        </div>
        <br>

        <!-- Contraseña -->
        <div>
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
        </div>
        <br>

        <!-- Edad -->
        <div>
            <label for="edad">Edad:</label><br>
            <input type="number" id="edad" name="edad" min="1" max="120" required>
        </div>
        <br>

        <!-- Fecha de nacimiento -->
        <div>
            <label for="fechaNacimiento">Fecha de nacimiento:</label><br>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
        </div>
        <br>

        <!-- Género (Radio buttons) -->
        <div>
            <label>Género:</label><br>
            <input type="radio" id="masculino" name="genero" value="masculino">
            <label for="masculino">Masculino</label><br>

            <input type="radio" id="femenino" name="genero" value="femenino">
            <label for="femenino">Femenino</label><br>

            <input type="radio" id="otro" name="genero" value="otro">
            <label for="otro">Otro</label>
        </div>
        <br>

        <!-- Intereses (Checkboxes) -->
        <div>
            <label>Intereses:</label><br>
            <input type="checkbox" id="interesMusica" name="intereses" value="musica">
            <label for="interesMusica">Música</label><br>

            <input type="checkbox" id="interesDeporte" name="intereses" value="deporte">
            <label for="interesDeporte">Deporte</label><br>

            <input type="checkbox" id="interesTecnologia" name="intereses" value="tecnologia">
            <label for="interesTecnologia">Tecnología</label>
        </div>
        <br>

        <!-- Fotografía de perfil -->
        <div>
            <label for="foto">Fotografía de perfil:</label><br>
            <input type="file" id="foto" name="foto" accept="image/*">
        </div>
        <br>

        <!-- Color favorito -->
        <div>
            <label for="colorFavorito">Color favorito:</label><br>
            <input type="color" id="colorFavorito" name="colorFavorito">
        </div>
        <br>

        <!-- Nivel de satisfacción -->
        <div>
            <label for="satisfaccion">Nivel de satisfacción (1 al 10):</label><br>
            <input type="range" id="satisfaccion" name="satisfaccion" min="1" max="10" value="5">
        </div>
        <br>

        <!-- Botón Registrar -->
        <button type="submit">Registrar</button>

    </form>

</body>
</html>
